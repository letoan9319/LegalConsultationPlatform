apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-consumer
  namespace: production
  labels:
    app: metrics-consumer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: metrics-consumer
  template:
    metadata:
      labels:
        app: metrics-consumer
    spec:
      containers:
        - name: metrics-consumer
          image: ghcr.io/legal-consult/metrics-consumer:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "legal-kafka-cluster-brokers:9092"
            - name: KAFKA_GROUP_ID
              value: "metrics-consumer"
            - name: SCHEMA_REGISTRY_URL
              value: "http://schema-registry:8081"
            - name: ANOMALY_MODEL_PATH
              value: "/models/anomaly_detector.pkl"
            - name: ALERT_WEBHOOK_URL
              value: "http://alert-manager:9093/alerts"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            initialDelaySeconds: 30
            periodSeconds: 10
