apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-consumer
  namespace: production
  labels:
    app: ai-consumer
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-consumer
  template:
    metadata:
      labels:
        app: ai-consumer
    spec:
      containers:
        - name: ai-consumer
          image: ghcr.io/legal-consult/ai-consumer:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "legal-kafka-cluster-brokers:9092"
            - name: KAFKA_GROUP_ID
              value: "ai-consumer"
            - name: REDIS_URL
              value: "redis://legal-redis:6379"
            - name: SCHEMA_REGISTRY_URL
              value: "http://schema-registry:8081"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-api-secrets
                  key: openai-api-key
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            initialDelaySeconds: 30
            periodSeconds: 10
