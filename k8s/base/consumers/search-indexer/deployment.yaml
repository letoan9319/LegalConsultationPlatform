apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-indexer
  namespace: production
  labels:
    app: search-indexer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-indexer
  template:
    metadata:
      labels:
        app: search-indexer
    spec:
      containers:
        - name: search-indexer
          image: ghcr.io/legal-consult/search-indexer:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "legal-kafka-cluster-brokers:9092"
            - name: KAFKA_GROUP_ID
              value: "search-indexer"
            - name: SCHEMA_REGISTRY_URL
              value: "http://schema-registry:8081"
            - name: MEILISEARCH_URL
              value: "http://legal-meilisearch:7700"
            - name: MEILISEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: meilisearch-secrets
                  key: api-key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            initialDelaySeconds: 30
            periodSeconds: 10
