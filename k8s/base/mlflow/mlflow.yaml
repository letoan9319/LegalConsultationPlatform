# MLflow - Production Ready
apiVersion: v1
kind: Namespace
metadata:
  name: mlops
---
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-secrets
  namespace: mlops
type: Opaque
data:
  # Generate with: echo -n "your-key" | base64
  aws-access-key: Q0hBTkdFX0tFWQ==
  aws-secret-key: Q0hBTkdFX1NFQ1JFVF9LRVk=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
        app.kubernetes.io/name: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:latest
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: MLFLOW_TRACKING_URI
              valueFrom:
                secretKeyRef:
                  name: mlflow-db-secrets
                  key: connection-string
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: mlflow-secrets
                  key: aws-access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mlflow-secrets
                  key: aws-secret-key
            - name: AWS_DEFAULT_REGION
              value: "ap-hanoi-1"
            - name: MLFLOW_ARTIFACT_ROOT
              value: "s3://legal-ml-artifacts/"
            - name: MLFLOW_GUNICORN_OPTS
              value: "--timeout 60"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-db-secrets
  namespace: mlops
type: Opaque
data:
  # Generate with: echo -n "postgresql://user:pass@host:5432/db" | base64
  connection-string: cG9zdGdyZXNxbDovL2xlZ2FsdXNlcjpDSEFOR0VfUEE3UzdTOEBwb3N0Z3Jlc3FsLnByb2R1Y3Rpb24uc3ZjOjU0MzIvbWxm
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlops
  labels:
    app: mlflow
spec:
  clusterIP: None
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
      name: http
