# MLflow - Production Ready
# NOTE: Secrets should be managed via External Secrets Operator or Vault.
# Generate actual secrets and apply separately.
# This file references secrets that MUST be created before deployment.
---
# Secrets to be created separately:
# apiVersion: v1
# kind: Secret
# metadata:
#   name: mlflow-secrets
#   namespace: mlops
# type: Opaque
# data:
#   aws-access-key: <base64-encoded-key>
#   aws-secret-key: <base64-encoded-secret>
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: mlflow-db-secrets
#   namespace: mlops
# type: Opaque
# data:
#   connection-string: <base64-encoded-pg-uri>
---
apiVersion: v1
kind: Namespace
metadata:
  name: mlops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
        app.kubernetes.io/name: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.10.0
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: MLFLOW_TRACKING_URI
              valueFrom:
                secretKeyRef:
                  name: mlflow-db-secrets
                  key: connection-string
                  optional: false
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: mlflow-secrets
                  key: aws-access-key
                  optional: false
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mlflow-secrets
                  key: aws-secret-key
                  optional: false
            - name: AWS_DEFAULT_REGION
              value: "ap-hanoi-1"
            - name: MLFLOW_ARTIFACT_ROOT
              value: "s3://legal-ml-artifacts/"
            - name: MLFLOW_GUNICORN_OPTS
              value: "--timeout 60"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlops
  labels:
    app: mlflow
spec:
  clusterIP: None
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
      name: http
