apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: production
  labels:
    app: postgresql
spec:
  clusterIP: None
  selector:
    app: postgresql
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-lb
  namespace: production
  labels:
    app: postgresql
spec:
  type: LoadBalancer
  selector:
    app: postgresql
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
