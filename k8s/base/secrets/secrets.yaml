# Secrets manifest - Apply separately with real values
# Generate secrets with:
#   kubectl create secret generic meilisearch-secrets \
#     --from-literal=master-key='your-secure-master-key' \
#     -n production --dry-run=client -o yaml | kubectl apply -f -
#
#   kubectl create secret generic mlflow-secrets \
#     --from-literal=aws-access-key='your-aws-key' \
#     --from-literal=aws-secret-key='your-aws-secret' \
#     -n mlops --dry-run=client -o yaml | kubectl apply -f -
#
#   kubectl create secret generic mlflow-db-secrets \
#     --from-literal=connection-string='postgresql://user:pass@host:5432/db' \
#     -n mlops --dry-run=client -o yaml | kubectl apply -f -
---
# Meilisearch Secret
apiVersion: v1
kind: Secret
metadata:
  name: meilisearch-secrets
  namespace: production
type: Opaque
stringData:
  master-key: "REPLACE_WITH_SECURE_MASTER_KEY"
---
# MLflow Secrets
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-secrets
  namespace: mlops
type: Opaque
stringData:
  aws-access-key: "REPLACE_WITH_AWS_ACCESS_KEY"
  aws-secret-key: "REPLACE_WITH_AWS_SECRET_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-db-secrets
  namespace: mlops
type: Opaque
stringData:
  connection-string: "REPLACE_WITH_POSTGRES_CONNECTION_STRING"
